# instruments.yaml — design-pro
# Owner of the UX / a11y / i18n rule. Accepts external instruments that
# produce candidates for its canonical checks (CONTRACTS §7.4).
platforms: [web, desktop]
accepts:
  - producer: ui-system
    instrument: audit_ui.py
    for-checks:
      - a11y-critical-flows
    note: |
      audit_ui.py produces ΔL OKLCH candidates over tokens.css. It never
      closes an a11y verdict alone — rendered pixels need a screenshot and
      perceptual sampling (design-pro's own instrument).

  # The keyboard pass on the running app, driven by verify.
  - producer: verify
    instrument: browser-driver
    platforms: [web]
    for-checks:
      - a11y-critical-flows
  - producer: drive-app-window
    instrument: gui.ps1
    platforms: [desktop]
    for-checks:
      - a11y-critical-flows

  - producer: design-pro
    instrument: screenshot-sample
    for-checks: ["*"]

  - producer: design-pro
    instrument: keyboard-traversal
    for-checks: ["*"]

  - producer: design-pro
    instrument: dom-inspection
    for-checks: ["*"]
