name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Version manifests agree
        run: python -c "import json,glob; vs={f: json.load(open(f,encoding='utf-8'))['version'] for f in ['plugin.json', *glob.glob('plugins/*/.claude-plugin/plugin.json')]}; m=json.load(open('.claude-plugin/marketplace.json',encoding='utf-8')); vs.update({'marketplace:'+p['name']: p['version'] for p in m['plugins']}); assert len(set(vs.values()))==1, ('version drift', vs); print('version', set(vs.values()))"
      - name: Description ceiling (fails above 250 characters)
        run: python scripts/measure-descriptions.py plugins
      - name: Unit tests (evidence, report, quality_scan)
        run: python -m pytest tests -q
