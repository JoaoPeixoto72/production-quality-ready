# Declarative spec of the 3 standard gates (CONTRACTS.md §7.3), the source
# audit-app reads to apply gates. A project gate pack may ADD gates; it may
# not remove or change these.

gates:

  - name: release-candidate
    description: |
      Builds, tests ran, no BLOCKER. A LOW FAIL on a non-critical check
      does not stop a candidate.
    requires:
      - no-open: [BLOCKER]
      - coverage-complete: [code-review, verify]

  - name: production-ready
    description: |
      Every owner with complete coverage, no BLOCKER/CRITICAL, and the
      non-negotiable areas (security, release) 100% PASS.
    requires:
      - no-open: [BLOCKER, CRITICAL]
      - coverage-complete: "<all-applicable-owners>"
      - all-pass-in-owner: [security-audit, release-audit]

  - name: sellable
    description: |
      Production-ready and fit to sell: activation, licence, support,
      error paths all verified.
    requires:
      - gate: production-ready
      - all-pass-in-owner: [commercial-readiness]

# Platform (CONTRACTS §5.4):
#   gates.json declares `platform: web | desktop | both`. An owner/check whose
#   `platforms:` excludes the project's is NOT_APPLICABLE by default and does
#   not count for coverage-complete. `sales-model: licensed | subscription |
#   both` selects the commercial-readiness rows.
#
# Supported predicates (CONTRACTS §7.1):
#   no-open: [severities...]            # no FAIL with that severity
#   all-pass-in-owner: [owners...]      # every emitted check = PASS
#   coverage-complete: [owners...]      # every canonical check resolved
#   coverage-complete: "<all-applicable-owners>"   # macro
#   conditional: { when: <cond>, require: [predicates...] }
#   gate: <name>                        # composition: another gate must close
