# instruments.yaml — security-audit
# Rule ASVS 5.0. Each check has a canonical producer; without one = missing-producer.
# A PASS without command + log is invalid (CONTRACTS §4.6).
platforms: [web, desktop]
accepts:
  - producer: security-audit
    instrument: threat-model-check
    for-checks:
      - sec.threat-model-declared
      - sec.auth-strength
      - sec.capabilities-min
      - sec.csp-strict
      - sec.api-surface-declared
      - sec.crypto-primitives-justified
      - sec.transport-tls
      - sec.data-at-rest
  - producer: code-review
    instrument: test-runner
    for-checks:
      - sec.session-integrity
      - sec.access-control-default-deny
      - sec.tenant-isolation
      - sec.input-validated
      - sec.process-boundaries
      - sec.paths-canonicalized
      - sec.errors-no-leak
      - sec.business-logic-abuse
      - sec.file-uploads-safe
  - producer: security-audit
    instrument: dep-scanner
    for-checks:
      - sec.deps-no-cve
      - sec.deps-provenance
  - producer: security-audit
    instrument: secret-scanner
    for-checks:
      - sec.secrets-not-committed
