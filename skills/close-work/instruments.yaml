# instruments.yaml — close-work
# Universal contract with a local adapter; accepts evidence from its own
# adapter only.
platforms: [web, desktop]
accepts:
  - producer: close-work
    instrument: adapter-local
    for-checks: ["*"]
  - producer: close-work
    instrument: trim-check
    for-checks:
      - trim.comment-budget
      - trim.no-history
      - trim.no-constant-echo
      - trim.visible-text
