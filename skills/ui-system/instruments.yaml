# instruments.yaml — ui-system
# This owner is its own canonical producer: audit_ui.py runs and writes the
# evidence for the checks listed in SKILL.md §6.
platforms: [web, desktop]
accepts:
  - producer: ui-system
    instrument: audit_ui.py
    for-checks:
      - ui.architectural-boundary
      - ui.legacy-package
      - ui.invalid-boolean-selector
      - ui.color-mix-sum
      - ui.oklch-delta-l
      - ui.remote-fonts
      - ui.ai-generic-fonts
      - ui.focus-ring
      - ui.reduced-motion
      - ui.unstyled-component
