# instruments.yaml — ui-system
# Este owner é ele próprio o producer canónico: audit_ui.py corre e escreve
# a evidência dos 10 checks listados no SKILL.md §6.
platforms: [web, desktop]
accepts:
  - producer: ui-system
    instrument: audit_ui.py
    for-checks:
      - ui.architectural-boundary
      - ui.legacy-package
      - ui.invalid-boolean-selector
      - ui.color-mix-sum
      - ui.oklch-delta-l
      - ui.remote-fonts
      - ui.ai-generic-fonts
      - ui.focus-ring
      - ui.reduced-motion
      - ui.unstyled-component
