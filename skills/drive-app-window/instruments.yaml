# instruments.yaml — drive-app-window
# A technical capability: produces artefacts (screenshots, event logs)
# that other owners read as evidence. No verdict closes here.
platforms: [desktop]
accepts:
  - producer: drive-app-window
    instrument: gui.ps1
    for-checks:
      - dw.window-found
      - dw.pin-succeeded
      - dw.action-executed
